<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ruvaa — National News & Tourism Hub</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0b132b; color: #fff; margin: 0; padding: 20px; }
        header { text-align: center; padding: 20px 0; border-bottom: 2px solid #1c2541; }
        header h1 { color: #48cae4; margin: 0; }
        .container { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
        .card { background: #1c2541; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        input, select, textarea, button { width: 100%; padding: 10px; margin: 6px 0; font-size: 14px; border-radius: 5px; border: none; box-sizing: border-box; }
        input, select, textarea { background: #0b132b; color: #fff; border: 1px solid #48cae4; }
        textarea { resize: vertical; height: 80px; }
        button { background: #48cae4; color: #0b132b; font-weight: bold; cursor: pointer; }
        button:hover { background: #00b4d8; }
        #logs, #islandList { background: #03071e; padding: 12px; border-radius: 5px; height: 140px; overflow-y: scroll; font-family: monospace; font-size: 12px; }
        .checkbox-container { display: flex; align-items: center; gap: 10px; margin: 10px 0; }
        .checkbox-container input { width: auto; }
    </style>
</head>
<body>
    <header>
        <h1>Ruvaa ރުވާ</h1>
        <p>Maldives National News, Atolls & Tourism Command Center</p>
    </header>

    <div class="container">
        <!-- Editor Authentication Module -->
        <div class="card">
            <h3>🔐 Editor Portal</h3>
            <input type="text" id="username" placeholder="Editor Username" value="admin">
            <input type="password" id="password" placeholder="Password" value="secret">
            <button onclick="registerEditor()">Register Editor</button>
            <button onclick="loginEditor()" style="background: #52b788; color: #fff;">Login & Get Token</button>
            <p id="authStatus" style="font-size: 12px; color: #90e0ef; margin-top: 5px;">Status: Logged out</p>
        </div>

        <!-- Islands & Tourism Module -->
        <div class="card">
            <h3>🏝️ Atolls & Islands Module</h3>
            <button onclick="loadIslands()">Fetch Islands Database</button>
            <div id="islandList">Click button above to load active island hubs...</div>
        </div>
    </div>

    <div class="container">
        <!-- Article & Video Publishing Module -->
        <div class="card" style="grid-column: span 2;">
            <h3>✍️ Publish Article & Generate Social Video</h3>
            <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 15px;">
                <div>
                    <input type="text" id="articleTitle" placeholder="Article Headline..." value="Addu Atoll Expands Eco-Tourism Infrastructure">
                    <select id="articleIsland">
                        <option value="addu">Addu City</option>
                        <option value="male">Malé</option>
                        <option value="fuvahmulah">Fuvahmulah</option>
                    </select>
                    <textarea id="articleContent" placeholder="Article content body..."></textarea>
                </div>
                <div>
                    <div class="checkbox-container">
                        <input type="checkbox" id="generateVideo" checked>
                        <label for="generateVideo">Generate Vertical Social Video (FFmpeg)</label>
                    </div>
                    <button onclick="publishArticle()" style="background: #f77f00; color: #fff; margin-top: 20px; padding: 15px;">Publish & Broadcast</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Live Event Feed -->
    <div class="card" style="margin-top: 20px;">
        <h3>📡 Live Network Event Stream</h3>
        <div id="logs">Connecting to Ruvaa socket network...</div>
    </div>

    <script>
        const API_URL = 'https://ruvaa-production.up.railway.app'; // Fallback to http://localhost:3000 for local testing
        const socket = io(API_URL);
        const logs = document.getElementById('logs');
        let authToken = null;

        function logMessage(msg) {
            logs.innerHTML += <div>[\] \</div>;
            logs.scrollTop = logs.scrollHeight;
        }

        socket.on('connect', () => {
            logMessage(Connected to core engine. Socket ID: \);
        });

        socket.on('breaking-news-broadcast', (data) => {
            logMessage(🚨 NEW ARTICLE PUBLISHED: "\" (\));
        });

        async function registerEditor() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            try {
                const res = await fetch(\/api/auth/register, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                logMessage(data.message || data.error);
            } catch (err) {
                logMessage('Registration error: ' + err.message);
            }
        }

        async function loginEditor() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            try {
                const res = await fetch(\/api/auth/login, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                if (data.success) {
                    authToken = data.token;
                    document.getElementById('authStatus').innerText = 'Status: Authenticated as ' + username;
                    logMessage('Login successful. JWT token stored.');
                } else {
                    logMessage('Login failed: ' + data.error);
                }
            } catch (err) {
                logMessage('Login error: ' + err.message);
            }
        }

        async function loadIslands() {
            try {
                const res = await fetch(\/api/islands);
                const data = await res.json();
                const listEl = document.getElementById('islandList');
                listEl.innerHTML = '<ul>' + data.islands.map(i => <li><b>\</b> (\): \</li>).join('') + '</ul>';
                logMessage('Fetched islands database successfully.');
            } catch (err) {
                logMessage('Error fetching islands: ' + err.message);
            }
        }

        async function publishArticle() {
            const title = document.getElementById('articleTitle').value;
            const islandSlug = document.getElementById('articleIsland').value;
            const content = document.getElementById('articleContent').value;
            const generateVideo = document.getElementById('generateVideo').checked;

            try {
                const res = await fetch(\/api/articles, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title, islandSlug, content, generateVideo })
                });
                const data = await res.json();
                if (data.success) {
                    logMessage(Article published successfully! Video path: \);
                } else {
                    logMessage('Publishing failed: ' + data.error);
                }
            } catch (err) {
                logMessage('Publish error: ' + err.message);
            }
        }
    </script>
</body>
</html>
